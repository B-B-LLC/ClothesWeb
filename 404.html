<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sayfa bulunamadı — Clothes</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#F3EDE7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15100C" media="(prefers-color-scheme: dark)" />
    <!-- Bu sayfa her adreste açılabildiği için yollar köke göre (/...) yazıldı. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      /* Bu sayfada sayfa içi menü yok: düğmeyi sağa o itmiyor. Footer da alta otursun. */
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
      }
      main > .section {
        flex: 1;
      }
      .site-header .btn {
        margin-left: auto;
      }
    </style>
  </head>
  <body>
    <!--
      Türkçe metin sayfada, İngilizcesi data-en içinde. Adres /en ile başlıyorsa
      alttaki betik İngilizceye çevirir (data-en-href bağlantıları da değişir).
    -->
    <header class="site-header">
      <div class="wrap">
        <a class="wordmark" href="/" data-en-href="/en">Clothes</a>
        <a class="btn btn--primary btn--compact" href="/#indir" data-en-href="/en#download" data-en="Download">İndir</a>
      </div>
    </header>

    <main>
      <section class="section">
        <div class="wrap">
          <div class="card card--obsidian cta">
            <p class="t-label" style="color: var(--obsidian-textSecondary)">404</p>
            <h1 class="t-section" data-en="This page isn’t in the wardrobe.">Bu sayfa gardıropta yok.</h1>
            <p class="t-body" data-en="The address may have moved, or it never existed.">
              Aradığın adres taşınmış ya da hiç olmamış olabilir.
            </p>
            <div class="actions">
              <a class="btn btn--onDarkPrimary" href="/" data-en-href="/en" data-en="Back to the home page">Ana sayfaya dön</a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <span class="wordmark">Clothes</span>
        <span class="t-caption" data-en="Wardrobe and outfit app for iPhone and Android · © 2026">
          iPhone ve Android için gardırop ve kombin uygulaması · © 2026
        </span>
      </div>
    </footer>

    <script>
      if (/^\/en(\/|$)/.test(location.pathname)) {
        document.documentElement.lang = 'en';
        document.title = 'Page not found — Clothes';
        document.querySelectorAll('[data-en]').forEach(function (el) {
          el.textContent = el.getAttribute('data-en');
        });
        document.querySelectorAll('[data-en-href]').forEach(function (el) {
          el.href = el.getAttribute('data-en-href');
        });
      }
    </script>
  </body>
</html>
